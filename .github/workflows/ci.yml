name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Same version as the pre-commit hook; the release bytes are verified before they run.
      # --diff-merges=separate: plain `git log -p` shows no diff for a merge commit,
      # so a secret added while resolving a conflict would pass unscanned.
      - name: gitleaks over the full history
        run: |
          ver=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${sha}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --log-opts="--all --full-history --diff-merges=separate"

      # himmel's leak-class gate at a pinned commit, content-verified. The hostname
      # class needs the station's denylist, so it skips here and runs in pre-commit.
      - name: leak-classes over the tree
        run: |
          rev=0d5cb98847f8ded87fbc8c822d04260d42deba6c
          sha=83075edc58bc04ea5731fd02321cc604a523eb1c5742910d1772f9cc1d2130f0
          curl -sSfL "https://raw.githubusercontent.com/yotamleo-org/Himmel/${rev}/scripts/guardrails/leak-classes.sh" -o "$RUNNER_TEMP/leak-classes.sh"
          echo "${sha}  $RUNNER_TEMP/leak-classes.sh" | sha256sum -c -
          bash "$RUNNER_TEMP/leak-classes.sh" --tree

      - name: ruff
        run: pipx run ruff==0.14.0 check wyoming ha

      - name: smoke
        run: |
          python3 -I -m py_compile wyoming/roundtrip.py ha/assist.py
          rc=0; python3 -I ha/assist.py 2>"$RUNNER_TEMP/usage.txt" || rc=$?
          test "$rc" = 2
          grep -q '^Usage:' "$RUNNER_TEMP/usage.txt"

      - name: assist tests
        run: python3 -I ha/test_assist.py

      - name: gateway tests
        run: python3 -I gateway/test_gateway.py
