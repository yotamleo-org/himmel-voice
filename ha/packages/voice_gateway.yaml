# The voice brains save research to the luna inbox and read it back (HIMMEL-7734), through
# the station's voice-gateway (gateway/). Copy to /config/packages/ on Home Assistant and set
# in secrets.yaml:
#   voice_gateway_note_url: http://<station LAN address>:8740/note
#   voice_gateway_search_url: http://<station LAN address>:8740/search
#   voice_gateway_chief_url: http://<station LAN address>:8740/chief
#   voice_gateway_auth: Bearer <VOICE_GATEWAY_TOKEN>
#   voice_office_satellite: assist_satellite.<the office BOX-3>
# Then replace the placeholder entity ids in research_async with the real agents and satellite,
# and expose save_note, research and search_luna to Assist. ask_chief (HIMMEL-7735) is exposed
# only to the agent that serves the office satellite.

rest_command:
  voice_gateway_note:
    url: !secret voice_gateway_note_url
    method: post
    headers:
      authorization: !secret voice_gateway_auth
    content_type: application/json
    payload: '{{ {"title": title, "body": body, "brain": brain} | to_json }}'
    timeout: 10
  voice_gateway_search:
    url: !secret voice_gateway_search_url
    method: post
    headers:
      authorization: !secret voice_gateway_auth
    content_type: application/json
    payload: '{{ {"q": query} | to_json }}'
    timeout: 10
  voice_gateway_chief:
    url: !secret voice_gateway_chief_url
    method: post
    headers:
      authorization: !secret voice_gateway_auth
    content_type: application/json
    payload: '{{ {"satellite": satellite, "text": message} | to_json }}'
    timeout: 10

script:
  save_note:
    alias: Save note
    description: >-
      Save a note to the luna inbox. Use it when the user asks to save, note or remember
      something, or to keep what you found. Brain is the assistant writing it.
    mode: queued
    fields:
      title:
        description: A short title, a few words
        required: true
        selector:
          text:
      body:
        description: The note itself
        required: true
        selector:
          text:
            multiline: true
      brain:
        description: Which assistant wrote it
        required: true
        selector:
          select:
            options: [claude, codex]
    sequence:
      - action: rest_command.voice_gateway_note
        data:
          title: "{{ title }}"
          body: "{{ body }}"
          brain: "{{ brain }}"
        response_variable: saved
        continue_on_error: true
      - variables:
          result:
            saved: "{{ saved is defined and saved.status == 201 }}"
            path: "{{ saved.content.path if saved is defined and saved.status == 201 else '' }}"
      - stop: Saved
        response_variable: result

  research:
    alias: Research and save
    description: >-
      Research a topic in the background with the chosen assistant, save the answer to the
      luna inbox and announce when it is ready. Returns at once; tell the user you are on it.
    mode: parallel
    max: 3
    fields:
      topic:
        description: What to research
        required: true
        selector:
          text:
      brain:
        description: Which assistant researches it
        required: true
        selector:
          select:
            options: [claude, codex]
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.research_async
        data:
          variables:
            topic: "{{ topic }}"
            brain: "{{ brain }}"

  research_async:
    alias: Research (background run)
    description: Started by script.research; do not call it directly.
    # Queued, not parallel: a request beyond the running one waits its turn instead of being dropped.
    mode: queued
    max: 10
    fields:
      topic:
        required: true
        selector:
          text:
      brain:
        required: true
        selector:
          text:
    variables:
      # Placeholders: replace with your conversation agents and the BOX-3's satellite entity.
      agents:
        claude: conversation.claude
        codex: conversation.nabu_codex
      satellite: assist_satellite.box3_assist_satellite
    sequence:
      - action: conversation.process
        data:
          agent_id: "{{ agents[brain] }}"
          text: >-
            Research this and answer in a few short paragraphs, naming your sources: {{ topic }}
        response_variable: answer
        continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ answer is not defined or answer.response.response_type == 'error' }}"
        then:
          - action: assist_satellite.announce
            target:
              entity_id: "{{ satellite }}"
            data:
              message: "Research on {{ topic }} failed."
          - stop: Research failed
      - action: script.save_note
        data:
          title: "{{ topic }}"
          body: "{{ answer.response.speech.plain.speech }}"
          brain: "{{ brain }}"
        response_variable: note
      - action: assist_satellite.announce
        target:
          entity_id: "{{ satellite }}"
        data:
          message: >-
            {{ 'Research on ' ~ topic ~ ' is ready.' if note.saved
               else 'Research on ' ~ topic ~ ' could not be saved.' }}

  ask_chief:
    alias: Ask the chief
    description: >-
      Pass a spoken message to the himmel chief, for example to ask what is blocked or to ask
      it to pause. Only the office satellite may use it: pass your own satellite id. The chief
      treats the line as an unverified voice request: status and read-only asks are answered,
      anything that widens work (a dispatch, a merge, a push) only produces a confirm on the
      operator's phone. ok is false when the message was not delivered, for example when no
      chief is listening or the satellite is not the office one; say so rather than claiming
      it was sent.
    mode: queued
    max: 3
    fields:
      message:
        description: What the user said to the chief, in their words
        required: true
        selector:
          text:
      satellite:
        description: The entity id of the satellite the user is speaking to
        required: true
        selector:
          text:
    variables:
      # secrets.yaml: voice_office_satellite: assist_satellite.<the office BOX-3>. A missing
      # secret stops Home Assistant loading this file, so the script cannot run unrestricted.
      office_satellite: !secret voice_office_satellite
    sequence:
      - if:
          - condition: template
            value_template: "{{ satellite != office_satellite }}"
        then:
          - variables:
              refused:
                ok: false
          - stop: Refused
            response_variable: refused
      - action: rest_command.voice_gateway_chief
        data:
          satellite: "{{ satellite }}"
          message: "{{ message }}"
        response_variable: sent
        continue_on_error: true
      - variables:
          result:
            ok: "{{ sent is defined and sent.status == 200 }}"
      - stop: Done
        response_variable: result

  search_luna:
    alias: Search luna
    description: >-
      Search the saved voice notes in luna, for example what Codex or Claude found about a
      topic. Returns up to five notes with a title, path and snippet; ok is false when the
      search itself failed, which is not the same as no matches.
    mode: parallel
    fields:
      query:
        description: A few keywords
        required: true
        selector:
          text:
    sequence:
      - action: rest_command.voice_gateway_search
        data:
          query: "{{ query }}"
        response_variable: found
        continue_on_error: true
      - variables:
          result:
            ok: "{{ found is defined and found.status == 200 }}"
            results: "{{ found.content.results if found is defined and found.status == 200 else [] }}"
      - stop: Done
        response_variable: result
