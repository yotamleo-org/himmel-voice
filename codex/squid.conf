# The Codex proxy's only way out (HIMMEL-7733): CONNECT on 443 to the ChatGPT auth and backend
# hosts. Exact host names, no subdomains. No cache, logs to the container's stdout and stderr.
http_port 3128

acl codex_hosts dstdomain auth.openai.com chatgpt.com
acl SSL_ports port 443

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow codex_hosts
http_access deny all

cache deny all
# The rootfs is read-only and no-new-privileges blocks the setuid pinger.
pid_filename none
netdb_filename none
pinger_enable off
access_log stdio:/dev/stdout
cache_log /dev/stderr
logfile_rotate 0
coredump_dir /tmp
shutdown_lifetime 1 seconds
