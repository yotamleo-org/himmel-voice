# Generated by make_mascots.py. One animation per mascot and state: the firmware
# takes the frame count from the file and plays it at the fps set here, with
# the top-left corner of the mascot at mascot_x, mascot_y.
substitutions:
  mascot_x: "96"
  mascot_y: "50"
  fps_claude_idle: "2"
  fps_claude_listen: "2.5"
  fps_claude_think: "2.5"
  fps_claude_speak: "2.5"
  fps_claude_error: "2"
  fps_codex_idle: "2"
  fps_codex_listen: "2.5"
  fps_codex_think: "2.5"
  fps_codex_speak: "2.5"
  fps_codex_error: "2"
  fps_grokbot_idle: "2"
  fps_grokbot_listen: "2.5"
  fps_grokbot_think: "2.5"
  fps_grokbot_speak: "2.5"
  fps_grokbot_error: "2"
image:
  - platform: animation
    id: claude_idle
    file: assets/claude-idle.gif
    type: RGB565
