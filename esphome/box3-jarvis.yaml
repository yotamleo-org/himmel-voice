# ESP32-S3-BOX-3 voice satellite for Home Assistant Assist (HIMMEL-7777, tracker HIMMEL-7719).
# "Hey Jarvis" is detected on the device by the hey_jarvis micro wake word; the stock
# cutoff never fires on this hardware, so the cutoff is a substitution you tune.
#
# The screen (HIMMEL-7815) shows the voice state, the reply and a pixel-art mascot for
# the agent each wake word calls: "Hey Jarvis" Claude, "Hey Mycroft" Codex and
# "Hey Grok" Grokbot. BOOT talks without a wake word, or stops a reply. See README.md.
#
#   esphome compile box3-jarvis.yaml                  # default cutoff below
#   esphome -s wake_cutoff 0.60 compile box3-jarvis.yaml   # try another candidate
substitutions:
  name: box3-jarvis
  # Probability the model must reach before a wake fires. Lower wakes more easily
  # and also mis-wakes more; the stock hey_jarvis value is 0.97. See README.md.
  wake_cutoff: "0.60"
  # Number of consecutive frames averaged before the cutoff is compared.
  wake_window: "5"
  # The first Assistant select of this device in Home Assistant, and the pipeline
  # the HIMMEL-7780 daily cap switches it to. The screen shows "Local only" while
  # the select holds the cap pipeline.
  pipeline_select: select.jarvis_box_3_assistant
  cap_pipeline: himmel-cap-local

esphome:
  name: ${name}
  friendly_name: Jarvis BOX-3
  on_boot:
    priority: -100
    then:
      # Home Assistant enables the wake words its slots name; it never sees the
      # internal Hey Grok model, so the device enables that one itself.
      - micro_wake_word.enable_model: grok_ww
      - if:
          condition:
            switch.is_off: mute
          then:
            - micro_wake_word.start:
      - component.update: box_display

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    # As the official BOX-3 config: the wake word models run from PSRAM, and the
    # larger data cache keeps inference fed.
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

# The wake word logs every state change and every detection at DEBUG; keep it
# there whatever the global level.
logger:
  level: DEBUG
  logs:
    micro_wake_word: DEBUG
    voice_assistant: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  - id: audio_bus
    sda: GPIO8
    scl: GPIO18

i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO2
    i2s_bclk_pin: GPIO17
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: audio_bus
    bits_per_sample: 16bit
    sample_rate: 16000

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: audio_bus
    bits_per_sample: 16bit
    sample_rate: 16000

microphone:
  - platform: i2s_audio
    id: box_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO16
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: box_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO15
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono

# Replies play as announcements. The media player gives Home Assistant a volume
# control, and through it the satellite reports its wake words, so the Wake word
# selects in Home Assistant work.
media_player:
  - platform: speaker
    id: box_media_player
    name: None
    announcement_pipeline:
      speaker: box_speaker
      format: FLAC
      sample_rate: 16000
      num_channels: 1

switch:
  # The speaker amplifier is gated by a GPIO.
  - platform: gpio
    id: speaker_amp
    pin: GPIO46
    restore_mode: ALWAYS_ON
  # Mute silences the microphone and stops listening until it is turned off.
  - platform: template
    name: Mute
    id: mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - component.update: box_display
    on_turn_off:
      - microphone.unmute:
      - wait_until:
          condition:
            not:
              micro_wake_word.is_running:
          timeout: 2s
      - if:
          condition:
            and:
              - api.connected:
              - not:
                  micro_wake_word.is_running:
              - not:
                  voice_assistant.is_running:
          then:
            - micro_wake_word.start:
      - component.update: box_display

# BOOT, a tap on the screen, and Talk now in Home Assistant all run
# push_to_talk: talk to Assist without the wake word, or stop it while it runs.
# Talk now is also a debug aid, testing the microphone through speech-to-text
# and the reply.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute: push_to_talk

button:
  - platform: template
    name: Talk now
    on_press:
      - script.execute: push_to_talk

globals:
  # The agent on screen: 0 Claude, 1 Codex, 2 Grokbot.
  - id: agent
    type: int
    initial_value: "0"
  # The voice state on screen: 0 idle, 1 listening, 2 thinking, 3 speaking, 4 error.
  - id: phase
    type: int
    initial_value: "0"
  # Counts animation ticks for the mascot frames.
  - id: tick
    type: int
    initial_value: "0"
  - id: reply_text
    type: std::string
  - id: error_text
    type: std::string

script:
  - id: push_to_talk
    mode: single
    then:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
          else:
            - if:
                condition:
                  and:
                    - api.connected:
                    - switch.is_off: mute
                then:
                  # A start without a wake word runs the first pipeline, Claude's.
                  - lambda: id(agent) = 0;
                  # Stop the wake word first, so the restart in on_end runs as
                  # after a wake.
                  - micro_wake_word.stop:
                  - wait_until:
                      condition:
                        not:
                          micro_wake_word.is_running:
                      timeout: 1s
                  - voice_assistant.start:
  # An error stays on screen for a while, then the screen returns to idle.
  - id: clear_error
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            lambda: return id(phase) == 4;
          then:
            - lambda: id(phase) = 0;
            - component.update: box_display

micro_wake_word:
  id: mww
  microphone: box_mic
  models:
    - model: hey_jarvis
      id: jarvis_ww
      probability_cutoff: ${wake_cutoff}
      sliding_window_size: ${wake_window}
    - model: hey_mycroft
      id: mycroft_ww
    # Home Assistant offers a satellite two wake word slots, each with its own
    # pipeline: Hey Jarvis goes in the first (Claude), Hey Mycroft in the second
    # (Codex). Hey Grok is internal: it shows Grokbot and runs the second slot.
    # Model: TaterTotterson/Tater-Wake-Words (MIT).
    - model: https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/main/microWakeWordsV7/hey_grok.esphome.json
      id: grok_ww
      internal: true
  on_wake_word_detected:
    # The README counts these log lines for true and false wakes.
    - logger.log:
        format: "wake word detected: %s"
        args: ['wake_word.c_str()']
    - lambda: |-
        std::string w = wake_word;
        for (auto &c : w) c = std::tolower((unsigned char) c);
        id(agent) = w == "hey mycroft" ? 1 : w == "hey grok" ? 2 : 0;
    - voice_assistant.start:
        # Home Assistant picks the pipeline by the phrase of a slot's wake word.
        wake_word: !lambda 'return id(agent) == 2 ? std::string("Hey Mycroft") : wake_word;'

voice_assistant:
  id: va
  microphone: box_mic
  media_player: box_media_player
  micro_wake_word: mww
  # As the official BOX-3 config.
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: |-
        id(phase) = 1;
        id(reply_text).clear();
        id(error_text).clear();
    - component.update: box_display
  on_stt_vad_end:
    - lambda: id(phase) = 2;
    - component.update: box_display
  on_tts_start:
    - lambda: |-
        id(phase) = 3;
        id(reply_text) = x;
    - component.update: box_display
  # Wake detection and speaker playback share one I2S bus: restart detection
  # only once the reply has finished playing. A start request is also dropped
  # while the wake word is still stopping from the detection, so wait for both.
  # Every restart also requires the API client: a disconnect during the wait
  # stops detection, and it must stay stopped until the client returns.
  on_end:
    # The reply starts playing shortly after the pipeline ends.
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          and:
            - not:
                micro_wake_word.is_running:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
    - if:
        condition:
          and:
            - api.connected:
            - switch.is_off: mute
        then:
          - micro_wake_word.start:
    - if:
        condition:
          lambda: return id(phase) != 4;
        then:
          - lambda: id(phase) = 0;
    - component.update: box_display
  on_error:
    - lambda: |-
        id(phase) = 4;
        id(error_text) = message;
    - component.update: box_display
    - script.execute: clear_error
    - wait_until:
        condition:
          and:
            - not:
                micro_wake_word.is_running:
            - not:
                voice_assistant.is_running:
    - if:
        condition:
          and:
            - api.connected:
            - switch.is_off: mute
        then:
          - micro_wake_word.start:
  # The wake word stops after a detection; a wake that fires with no Home
  # Assistant connection ends silently, so restart on reconnect. A start
  # request is dropped while the stop from the disconnect is still in progress,
  # so let that finish first.
  on_client_connected:
    - wait_until:
        condition:
          not:
            micro_wake_word.is_running:
        timeout: 2s
    - if:
        condition:
          and:
            - api.connected:
            - switch.is_off: mute
            - not:
                micro_wake_word.is_running:
            - not:
                voice_assistant.is_running:
        then:
          - micro_wake_word.start:
    - component.update: box_display
  on_client_disconnected:
    - micro_wake_word.stop:
    - component.update: box_display

# The pipeline the first slot runs; "Local only" shows while it is the cap's.
text_sensor:
  - platform: homeassistant
    id: pipeline_state
    entity_id: ${pipeline_select}
    internal: true
    on_value:
      - component.update: box_display

# --- Screen -------------------------------------------------------------------

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_output

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

spi:
  - id: spi_bus
    clk_pin: GPIO7
    mosi_pin: GPIO6

touchscreen:
  - platform: gt911
    id: box_touch
    i2c_id: audio_bus
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    on_touch:
      - script.execute: push_to_talk

# Mascots drawn by assets/make_mascots.py: 8 frames each, two per state (idle,
# listen, think, speak).
image:
  - platform: animation
    id: mascot_claude
    file: assets/claude.gif
    type: RGB565
  - platform: animation
    id: mascot_codex
    file: assets/codex.gif
    type: RGB565
  - platform: animation
    id: mascot_grokbot
    file: assets/grokbot.gif
    type: RGB565

font:
  - file: gfonts://VT323
    id: font_bar
    size: 22
  - file: gfonts://VT323
    id: font_text
    size: 18
    glyphsets:
      - GF_Latin_Core

# The mascots move while listening, thinking and speaking, and blink when idle.
interval:
  - interval: 400ms
    then:
      - lambda: |-
          id(tick)++;
          int p = id(phase);
          if ((p >= 1 && p <= 3) || (p == 0 && id(tick) % 10 <= 1))
            id(box_display).update();

display:
  - platform: mipi_spi
    id: box_display
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    update_interval: never
    lambda: |-
      const Color bg(16, 20, 32), amber(248, 200, 72), ink(8, 8, 16), white(248, 252, 248);
      it.fill(bg);

      // The HIMMEL-7780 cap holds: Assist answers on the local pipeline only.
      if (id(pipeline_state).has_state() && id(pipeline_state).state == "${cap_pipeline}") {
        it.filled_rectangle(0, 0, 320, 22, amber);
        it.print(160, 11, id(font_bar), ink, TextAlign::CENTER, "Local only: daily AI cap");
      }

      static const char *const AGENTS[] = {"Claude", "Codex", "Grokbot"};
      static const char *const PHASES[] = {"Ready", "Listening", "Thinking", "Speaking", "Error"};
      int a = id(agent), p = id(phase);
      const char *status = PHASES[p];
      if (id(mute).state)
        status = "Muted";
      else if (!api::global_api_server->is_connected())
        status = "Offline";
      it.filled_rectangle(0, 24, 320, 24, p == 4 ? Color(200, 48, 48) : Color(40, 44, 60));
      it.print(8, 36, id(font_bar), white, TextAlign::CENTER_LEFT, AGENTS[a]);
      it.print(312, 36, id(font_bar), white, TextAlign::CENTER_RIGHT, status);

      // Two frames per state; idle shows the blink frame one tick in ten.
      auto *mascot = a == 1 ? id(mascot_codex) : a == 2 ? id(mascot_grokbot) : id(mascot_claude);
      int state = (p >= 1 && p <= 3) ? p : 0;
      int frame = state == 0 ? (id(tick) % 10 == 0 ? 1 : 0) : id(tick) % 2;
      mascot->set_frame(state * 2 + frame);
      it.image(96, 50, mascot);

      // The reply, or the error, word-wrapped to three lines.
      std::string rest = p == 4 ? id(error_text) : id(reply_text);
      Color colour = p == 4 ? Color(248, 136, 136) : white;
      int x1, y1, w, h;
      it.get_text_bounds(0, 0, "M", id(font_text), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
      size_t per_line = w > 0 ? 304 / w : 30;
      for (int line = 0; line < 3 && !rest.empty(); line++) {
        std::string out;
        if (rest.size() <= per_line) {
          out = rest;
          rest.clear();
        } else {
          size_t cut = rest.rfind(' ', per_line);
          if (cut == std::string::npos || cut == 0) {
            cut = per_line;
            while (cut > 0 && (rest[cut] & 0xC0) == 0x80) cut--;  // not inside a UTF-8 character
          }
          out = rest.substr(0, cut);
          size_t next = rest.find_first_not_of(' ', cut);
          rest = next == std::string::npos ? "" : rest.substr(next);
          if (line == 2 && !rest.empty()) {
            size_t keep = std::min(out.size(), per_line - 3);
            while (keep > 0 && (out[keep] & 0xC0) == 0x80) keep--;
            out = out.substr(0, keep) + "...";
          }
        }
        it.print(8, 182 + line * 19, id(font_text), colour, TextAlign::TOP_LEFT, out.c_str());
      }
